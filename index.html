    <!-- Schema.org — FAQ (aparece como resultado destacado no Google) -->

    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "O que são riscos psicossociais no trabalho?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Riscos psicossociais são fatores do ambiente de trabalho que podem causar danos à saúde mental e emocional dos trabalhadores, como sobrecarga, falta de autonomia, conflitos interpessoais e insegurança. A nova reescrita da NR-1 exige que todas as empresas identifiquem e gerenciem esses riscos."
          }
        },
        {
          "@type": "Question",
          "name": "O que exige a nova reescrita da NR-1 sobre riscos psicossociais?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A nova NR-1 exige que as empresas identifiquem os fatores de risco psicossociais, realizem o mapeamento com instrumentos validados como o HSE-IT, elaborem plano de ação e mantenham documentação comprobatória. Tanto o processo quanto o documento são exigidos — fiscais entrevistam trabalhadores e verificam evidências reais."
          }
        },
        {
          "@type": "Question",
          "name": "Quando começa a fiscalização da nova NR-1?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A fiscalização e autuação pelos órgãos competentes começa em maio de 2026. Empresas que não se adequarem estão sujeitas a multas, penalidades e processos trabalhistas."
          }
        },
        {
          "@type": "Question",
          "name": "Todas as empresas são obrigadas a se adequar à NR-1?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. Riscos psicossociais existem independentemente do porte, setor, cargo ou número de funcionários. A obrigação legal se aplica a empresas de todos os tamanhos e segmentos. Nem todas estão isentas da obrigação legal e nenhuma está isenta do impacto humano."
          }
        },
        {
          "@type": "Question",
          "name": "O que é o mapeamento de riscos psicossociais?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "É o processo de identificação e avaliação dos fatores de risco psicossocial presentes no ambiente de trabalho, realizado com instrumentos validados internacionalmente como o HSE-IT. O resultado é um inventário por setor e função, com plano de ação estruturado para adequação à NR-1 e cobertura documentada para fiscalização."
          }
        },
        {
          "@type": "Question",
          "name": "O que é a Metodologia VIDA da Rheviva?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A Metodologia VIDA é uma metodologia proprietária da Rheviva que conduz a implementação estruturada e permanente dos riscos psicossociais. Organizada em quatro dimensões — Vivência, Intenção, Decisão e Ação — integradas ao ciclo PDCA exigido pela NR-1. Cada etapa gera entregável concreto, evidência rastreável e documentação técnica com validade jurídica."
          }
        },
        {
          "@type": "Question",
          "name": "O que acontece se a empresa não se adequar à NR-1?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Empresas que não se adequam à nova NR-1 estão sujeitas a multas e penalidades, processos trabalhistas, perda de produtividade e retenção de talentos, além de danos à imagem e reputação. Afastamentos com nexo ocupacional reconhecido também aumentam o FAP e elevam o SAT/RAT sobre toda a folha de pagamento."
          }
        },
        {
          "@type": "Question",
          "name": "O que é Conformidade Ativa?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Conformidade Ativa é o método da Rheviva que transforma a obrigação legal em processo vivo: não um documento na gaveta, mas gestão contínua com monitoramento real, revisões periódicas e segurança jurídica sustentável. É mais que checklist — é execução estruturada real com evidências rastreáveis."
          }
        }
      ]
    }
